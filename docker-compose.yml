version: '3.8'

services:
  dfserver:
    build: .
    container_name: df_multiplayer
    ports:
      - "2222:22"     # SSH
      - "1234:1234"   # DFPlex WebSocket
      - "8000:8000"   # DFPlex HTTP (browser fallback)
      - "8001:8001"   # Client download
    volumes:
      - df_saves:/home/dfplayer/df/data/save   # persist fortress saves
    restart: unless-stopped
    shm_size: '256mb'
    # Allow personality syscall for setarch (needed by some DF versions)
    security_opt:
      - seccomp:unconfined

volumes:
  df_saves:
